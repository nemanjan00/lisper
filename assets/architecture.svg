<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Architecture: a small kernel exposes eval, register-tool and hooks; the agent grows its own UI, tools, compactor and notes on top; a supervisor and boot-checked git keep it safe">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0c8"/>
    </marker>
  </defs>
  <style>
    .t   { font: 700 20px 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef0ff; }
    .s   { font: 400 14px 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9aa0c8; }
    .m   { font: 500 14px 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #dfe3ff; }
    .tag { font: 700 12px 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 2px; }
  </style>
  <rect width="1200" height="520" rx="20" fill="#070812"/>

  <!-- layer 3: the agent's own code -->
  <rect x="30" y="24" width="1140" height="176" rx="16" fill="#7c5cff" fill-opacity="0.10" stroke="#7c5cff"/>
  <text class="tag" x="54" y="52" fill="#7c5cff">WRITTEN BY THE AGENT · init.lisp + lisp/</text>
  <g>
    <rect x="54"  y="72" width="250" height="104" rx="12" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="t" x="74" y="104">Terminal UI</text>
    <text class="s" x="74" y="128">panes, layout, drag-resize,</text>
    <text class="s" x="74" y="148">status line, input</text>

    <rect x="326" y="72" width="250" height="104" rx="12" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="t" x="346" y="104">Editing tools</text>
    <text class="s" x="346" y="128">edit_file, edit_files,</text>
    <text class="s" x="346" y="148">replace_form</text>

    <rect x="598" y="72" width="250" height="104" rx="12" fill="#0b0d17" stroke="#ff5ca8"/>
    <text class="t" x="618" y="104">Compactor</text>
    <text class="s" x="618" y="128">rewind · offload · restore</text>
    <text class="s" x="618" y="148">context stays small</text>

    <rect x="870" y="72" width="276" height="104" rx="12" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="t" x="890" y="104">Notes, todos, tasks</text>
    <text class="s" x="890" y="128">memory that survives</text>
    <text class="s" x="890" y="148">restarts and sessions</text>
  </g>

  <!-- arrows up from kernel -->
  <line x1="180" y1="262" x2="180" y2="206" stroke="#9aa0c8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="451" y1="262" x2="451" y2="206" stroke="#9aa0c8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="723" y1="262" x2="723" y2="206" stroke="#9aa0c8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1008" y1="262" x2="1008" y2="206" stroke="#9aa0c8" stroke-width="2" marker-end="url(#arr)"/>
  <text class="s" x="600" y="236" text-anchor="middle" fill="#9aa0c8">eval · register-tool · hooks</text>

  <!-- layer 2: kernel -->
  <rect x="30" y="268" width="1140" height="108" rx="16" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff"/>
  <text class="tag" x="54" y="296" fill="#00d4ff">THE KERNEL · core.lisp · plain SBCL, no libraries</text>
  <g>
    <rect x="54"  y="312" width="190" height="42" rx="21" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="m" x="149" y="338" text-anchor="middle">agent loop</text>
    <rect x="260" y="312" width="190" height="42" rx="21" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="m" x="355" y="338" text-anchor="middle">eval</text>
    <rect x="466" y="312" width="190" height="42" rx="21" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="m" x="561" y="338" text-anchor="middle">register-tool</text>
    <rect x="672" y="312" width="190" height="42" rx="21" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="m" x="767" y="338" text-anchor="middle">sessions + queue</text>
    <rect x="878" y="312" width="268" height="42" rx="21" fill="#0b0d17" stroke="#2a2f55"/>
    <text class="m" x="1012" y="338" text-anchor="middle">trace.log · hooks</text>
  </g>

  <!-- layer 1: safety -->
  <line x1="600" y1="440" x2="600" y2="382" stroke="#9aa0c8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="446" width="1140" height="58" rx="16" fill="#3ddc97" fill-opacity="0.08" stroke="#3ddc97"/>
  <text class="tag" x="54" y="472" fill="#3ddc97">THE SAFETY NET</text>
  <text class="s" x="54" y="492" fill="#dfe3ff">fresh-boot check before every save  ·  boot-checked git commits  ·  supervisor rolls back to last-good</text>
</svg>
