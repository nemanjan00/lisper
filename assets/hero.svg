<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="lisper: the AI agent that builds its own harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070812"/>
      <stop offset="0.55" stop-color="#14103a"/>
      <stop offset="1" stop-color="#220f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#ff5ca8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5ca8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#glowL)"/>
  <rect width="1200" height="440" rx="24" fill="url(#glowR)"/>

  <!-- giant parentheses -->
  <g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" fill="url(#accent)" opacity="0.07">
    <text x="-30" y="400" font-size="560">(</text>
    <text x="900" y="400" font-size="560">)</text>
  </g>

  <!-- floating glyphs -->
  <g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#9aa0c8" opacity="0.35" font-size="18">
    <text x="90" y="120">(defun</text>
    <text x="150" y="330">(eval</text>
    <text x="1010" y="110">(hook</text>
    <text x="1030" y="300">(rewind</text>
    <text x="60" y="230">λ</text>
    <text x="1120" y="210">λ</text>
  </g>

  <!-- emblem -->
  <g>
    <circle cx="600" cy="70" r="34" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#blur)" opacity="0.8"/>
    <circle cx="600" cy="70" r="34" fill="#0b0d17" stroke="url(#accent)" stroke-width="3"/>
    <text x="600" y="85" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="url(#accent)">λ</text>
    <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="600" y="190" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-3" fill="url(#accent)">lisper</text>

  <text x="600" y="244" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#eef0ff">The AI agent that builds its own harness.</text>
  <text x="600" y="280" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9aa0c8">One tool. One live Lisp image. Everything else, it writes itself.</text>

  <!-- chips -->
  <g font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#dfe3ff">
    <rect x="220" y="306" width="150" height="36" rx="18" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff"/>
    <text x="295" y="330">self-editing</text>
    <rect x="390" y="306" width="150" height="36" rx="18" fill="#00d4ff" fill-opacity="0.14" stroke="#00d4ff"/>
    <text x="465" y="330">crash-proof</text>
    <rect x="560" y="306" width="190" height="36" rx="18" fill="#ff5ca8" fill-opacity="0.14" stroke="#ff5ca8"/>
    <text x="655" y="330">context that rewinds</text>
    <rect x="770" y="306" width="210" height="36" rx="18" fill="#3ddc97" fill-opacity="0.14" stroke="#3ddc97"/>
    <text x="875" y="330">no libraries, no lock-in</text>
  </g>

  <!-- code strip -->
  <rect x="300" y="366" width="600" height="42" rx="10" fill="#05060d" stroke="#2a2f55"/>
  <text x="330" y="393" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#3ddc97" textLength="420" lengthAdjust="spacing">&gt; (register-tool "my-next-superpower" ...)</text>
  <rect x="734" y="379" width="9" height="20" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
