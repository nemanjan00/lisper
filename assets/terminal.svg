<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="lisper's terminal UI, written by the agent itself: a chat pane and a context pane">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c5cff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="10" y="6" width="1080" height="484" rx="14" fill="#0b0d17" stroke="#2a2f55" filter="url(#shadow)"/>
  <path d="M10 20 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v22 h-1080 z" fill="#161a33"/>
  <circle cx="34" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="24" r="6" fill="#febc2e"/>
  <circle cx="78" cy="24" r="6" fill="#28c840"/>
  <text x="550" y="29" text-anchor="middle" font-family="'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0c8">lisper — every pixel of this UI was written by the agent</text>

  <g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <!-- pane titles -->
    <text x="26" y="64" fill="#7c5cff" font-weight="700">─ chat ───────────────────────────────────────────────────────────────</text>
    <text x="740" y="64" fill="#ff5ca8" font-weight="700">─ context ────────────────────────</text>
    <line x1="716" y1="52" x2="716" y2="440" stroke="#2a2f55"/>

    <!-- chat pane -->
    <g>
      <text x="26" y="92" fill="#6b7199">k3 is thinking… (context 74,724 tokens, 56,832 cached)</text>
      <text x="26" y="114" fill="#00d4ff">  → eval: shell</text>
      <text x="26" y="136" fill="#6b7199">  ← 12 lines</text>
      <text x="26" y="158" fill="#6b7199">k3 is thinking… (context 75,506 tokens, 75,008 cached)</text>
      <text x="26" y="184" fill="#eef0ff">All pieces confirmed. Implementing in dependency order —</text>
      <text x="26" y="204" fill="#eef0ff">first the hooks in existing files:</text>
      <text x="26" y="228" fill="#00d4ff">  → edit_files: {"edits":[{"new":"(defvar *tui-stop-hooks* …</text>
      <text x="26" y="250" fill="#3ddc97">  ✓ edited lisp/tui.lisp, lisp/tui-input.lisp, lisp/panes.lisp</text>
      <text x="26" y="270" fill="#3ddc97">    5 edits · fresh boot clean · committed together</text>
      <text x="26" y="294" fill="#6b7199">k3 is thinking… (context 75,730 tokens, 75,264 cached)</text>
      <text x="26" y="320" fill="#eef0ff">Hooks in. Now the tasks file:</text>
      <text x="26" y="342" fill="#00d4ff">  → eval: in-package</text>
      <text x="26" y="364" fill="#6b7199">  ← 33 lines</text>
      <text x="26" y="390" fill="#eef0ff">It committed. Now ask.lisp:</text>
      <text x="26" y="412" fill="#00d4ff">  → eval: in-package</text>
      <text x="26" y="440" fill="#3ddc97">&gt;</text>
      <rect x="42" y="428" width="8" height="15" fill="#00d4ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- context pane -->
    <g>
      <text x="740" y="92" fill="#eef0ff" font-weight="700">context: 85k tokens</text>
      <text x="740" y="112" fill="#9aa0c8">8% of 1M · 43% of budget</text>
      <rect x="740" y="124" width="320" height="10" rx="5" fill="#161a33"/>
      <rect x="740" y="124" width="138" height="10" rx="5" fill="url(#accent)"/>
      <text x="740" y="160" fill="#6b7199">+4.4k est since · 130 messages</text>

      <text x="740" y="196" fill="#ff5ca8">rewind e200…e246</text>
      <text x="740" y="214" fill="#9aa0c8">  DONE: blank todo+context pane   (9.9k)</text>
      <text x="740" y="244" fill="#ff5ca8">rewind e68…e157</text>
      <text x="740" y="262" fill="#9aa0c8">  all 4 review todos DONE         (15k)</text>
      <text x="740" y="292" fill="#ff5ca8">rewind e17…e26</text>
      <text x="740" y="310" fill="#9aa0c8">  edit_files verification         (450)</text>
      <text x="740" y="340" fill="#ff5ca8">rewind e14…e15</text>
      <text x="740" y="358" fill="#9aa0c8">  read-file-string undefined      (370)</text>
      <text x="740" y="388" fill="#ff5ca8">rewind e1…e8</text>
      <text x="740" y="406" fill="#9aa0c8">  verified edit_files, new core   (400)</text>
    </g>

    <!-- status bar -->
    <rect x="10" y="454" width="1080" height="36" fill="#161a33"/>
    <path d="M10 490 v-14 h1080 v14 a14 14 0 0 1 -14 0 h-1052 a14 14 0 0 1 -14 0 z" fill="#161a33"/>
    <text x="26" y="477" fill="#eef0ff">lisping-ai</text>
    <text x="110" y="477" fill="#00d4ff">k3</text>
    <text x="146" y="477" fill="#febc2e">[3 todos open]</text>
    <text x="262" y="477" fill="#9aa0c8">chat</text>
    <text x="310" y="477" fill="#ff5ca8">[2 held]</text>
  </g>
</svg>
